name: garment-erp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: garment_erp
      POSTGRES_PASSWORD: garment_erp
      POSTGRES_DB: garment_erp
    ports:
      - "5432:5432"
    volumes:
      - garment-erp-postgres:/var/lib/postgresql/data

volumes:
  garment-erp-postgres:
